# gitleaks baseline — deposited copy (CORE-578) of a fleet baseline
# (operator-private: ~/Code/natabula/configs/.gitleaks.toml). Extends the
# upstream default ruleset and allowlists the false-positive classes a
# fleet-wide measurement actually produced — nothing speculative.
#
# Consumed here by the CI secret-scan step (.github/workflows/ci.yml, working
# tree), which passes this file explicitly.
#
# Comments in this copy are reworded to stand alone (CORE-652.2); the
# allowlist rules are byte-identical to the source. An operator-side refresh
# will show the comment diff — review it before overwriting.
title = "flowtron gitleaks baseline"

[extend]
useDefault = true

# ── Allowlists ────────────────────────────────────────────────────────────────
#
# Every path below was measured, not guessed. Across 22 fleet roots the default
# ruleset produced 17 HEAD-tracked hits, all of them `generic-api-key`. The
# three classes allowlisted here account for 12; this config deliberately still
# reports the other 5 (production source and setup docs in individual repos)
# because those are per-repo judgments, not universal ones — they belong in a
# repo-local .gitleaks.toml allowlist. Universal classes here; project-specific
# noise there.
#
# Scoping by path rather than disabling generic-api-key globally keeps every
# high-confidence rule — aws, jwt, github-pat, private-key, stripe — live
# everywhere, including inside these files. That matters: the one genuine hit
# the fleet measurement found was a `jwt`, not a generic key.

[[allowlists]]
description = """
Archived flowtron tasknotes. Write-once by policy (SPEC §"Tasknote
frontmatter"), so a false positive in one cannot be fixed by editing the
historical record. Prose in a closed tasknote is documentation of past work,
never a live credential surface.
Measured hits: two archived tasknotes across two fleet repos.
"""
paths = ['''(^|/)\.flowtron/tasknote/archive/.*\.md$''']

[[allowlists]]
description = """
Test fixtures and test modules. Fake credentials are the point of a credential
test — a scanner hit here is the fixture working as designed. Scoped to test
trees only, so production code carrying the same shape still fires.
Measured hits: backend test trees in two fleet repos (3 modules + 1 fixture
script; 1 service test).
"""
paths = [
  '''(^|/)tests?/.*''',
  '''(^|/)__tests__/.*''',
  '''(^|/).*\.(test|spec)\.(ts|tsx|js|jsx|py)$''',
  '''(^|/)conftest\.py$''',
]

[[allowlists]]
description = """
Committed placeholder and template files. `.env.example` and its `*.template`
equivalents exist to show the shape of a credential without carrying one —
the same convention the fleet's audit register (operator-private) exempts
from the on-disk credential-shaped-file class.
Measured hits: one repo's .env.example + k8s/secret.yaml.template.
"""
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.sample$''',
  '''(^|/).*\.template$''',
  '''(^|/).*\.example$''',
]
