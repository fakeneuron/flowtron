name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # update-adopters tests clone this checkout and check out historical
          # release tags for behind/drift fixtures. Default depth-1 omits tags.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viz/package-lock.json
      - run: npm --prefix viz ci
      - run: npm --prefix viz test
      - run: npm --prefix viz run typecheck
      - run: npm --prefix viz run lint
      - run: node --test tools/update-adopters.test.mjs
      - run: node --check tools/update-adopters.test.mjs
      - run: node --check tools/update-adopters.mjs

      # Stack-agnostic (docs-only repos included), so it sits on `validate`
      # rather than a stack-specific lane. --config differs from natabula's
      # own workflow on purpose: natabula is where the baseline canonically
      # lives (configs/.gitleaks.toml); flowtron deposits its copy at repo
      # root (CORE-578), so it is read in place rather than duplicated.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --no-banner --redact

  # Cross-file drift checks — the release-context-free subset of /ft-release
  # §7.1 (plus SPEC/layout.md §"Skill namespace"), so drift is caught on the commit
  # that lands it instead of at the next cut. §7.1 remains the release gate and
  # the broader superset; nothing here replaces it.
  #
  # Keep every step in the `- name:` + `run: |` shape. §7.1 Pair H extracts this
  # workflow's commands with `grep -E '^      - run: '` and diffs them against
  # AGENTS.md §"Validation" — a single-line `- run:` here would leak into that
  # extraction and break the release gate.
  #
  # The §7.1 blocks print their findings but exit 0, so each loop below carries
  # a `bad=` accumulator to turn a finding into a failing step. Do not "simplify"
  # that to `out=$(for … done)`: bash's `$( )` parser reads a `case` pattern's
  # closing `)` as the end of the substitution, and the flag checks below
  # die with `syntax error near unexpected token ';;'`.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Wrapper-name invariant (SPEC/layout.md §"Skill namespace")
        run: |
          bad=
          for f in claude/commands/ft-*.md; do
            grep -q "\`$(basename "$f" .md)\`" "$f" || { echo "NO SELF-NAME  $f"; bad=1; }
          done
          [ -z "$bad" ] || exit 1

      - name: Shipped-skill parity (claude/skills ↔ codex/skills)
        run: |
          diff -u <(find claude/skills -mindepth 1 -maxdepth 1 -type d -exec test -f "{}/SKILL.md" \; -print | sed 's#^claude/skills/##' | sort) \
                  <(find codex/skills  -mindepth 1 -maxdepth 1 -type d -exec test -f "{}/SKILL.md" \; -print | sed 's#^codex/skills/##' | sort)

      - name: Context budget (docs/CONTEXT-BUDGET.md §"Budgets")
        run: |
          bad=
          exact=$(awk '/^## Budgets$/,/^## Known over budget/' docs/CONTEXT-BUDGET.md \
                  | grep -E '^\| `[^`]+` \| [0-9,]+ \|' \
                  | sed -E 's/^\| `([^`]+)` \|.*/\1/' \
                  | grep -v '\*')
          while IFS='|' read -r surface budget; do
            budget=${budget//,/}
            case "$surface" in
              *'*'*)
                for f in $surface; do
                  [ -f "$f" ] || continue
                  case " $exact " in *" $f "*) continue ;; esac
                  n=$(wc -c < "$f")
                  [ "$n" -le "$budget" ] || { echo "OVER BUDGET  $f  $n > $budget"; bad=1; }
                done
                ;;
              *)
                n=$(wc -c < "$surface")
                [ "$n" -le "$budget" ] || { echo "OVER BUDGET  $surface  $n > $budget"; bad=1; }
                ;;
            esac
          done < <(awk '/^## Budgets$/,/^## Known over budget/' docs/CONTEXT-BUDGET.md \
                   | grep -E '^\| `[^`]+` \| [0-9,]+ \|' \
                   | sed -E 's/^\| `([^`]+)` \| ([0-9,]+) \|.*/\1|\2/')
          [ -z "$bad" ] || exit 1

      - name: Pair A — templates roster clause present in both surfaces
        run: |
          # Presence only. The content half — every file in templates/ named by
          # every clause — needs a filename-to-token derivation that exists
          # nowhere in the repo, and stays a §7.1 judgment call.
          bad=
          for f in README.md SPEC/layout.md; do
            grep -q 'tasknote templates (full' "$f" || { echo "NO ROSTER CLAUSE  $f"; bad=1; }
          done
          [ -z "$bad" ] || exit 1

      - name: Pair B — Claude skill flags ↔ Codex wrapper descriptions
        run: |
          bad=
          for d in claude/skills/ft-*/SKILL.md; do
            s=$(basename "$(dirname "$d")"); c="codex/skills/$s/SKILL.md"; [ -f "$c" ] || continue
            cf=$(grep -m1 '^description:' "$d" | sed -E 's/"[^"]*"//g' | grep -oE '\-\-[a-z][a-z-]+' | sort -u | tr '\n' ' ')
            xf=$(grep -m1 '^description:' "$c" | sed -E 's/"[^"]*"//g' | grep -oE '\-\-[a-z][a-z-]+' | sort -u | tr '\n' ' ')
            [ "$cf" = "$xf" ] || { echo "MISMATCH $s | claude:[$cf] codex:[$xf]"; bad=1; }
          done
          [ -z "$bad" ] || exit 1

      - name: Pair C — template back-link depth
        run: |
          if grep -rn '](\.\./\.\./PLAN\.md)' templates/; then
            echo "template back-link is one level too deep; skills write templates one level under .flowtron/"
            exit 1
          fi

      - name: Pair J — command-stub argument-hint ↔ documented flags
        run: |
          bad=
          for f in claude/commands/ft-*.md; do
            s=$(basename "$f" .md)
            own=$( { grep -m1 '^description:' "$f" | sed -E 's/"[^"]*"//g'
                     grep -o '`[^`]*`' "$f" | grep -E -- "/${s}[^a-z-]" ; } \
                   | grep -oE -e '--[a-z][a-z-]+' | sort -u | tr '\n' ' ')
            [ -z "$own" ] && continue
            hint=$(grep -m1 '^argument-hint:' "$f") \
              || { echo "MISSING HINT $s :: $own"; bad=1; continue; }
            for fl in $(printf '%s' "$own"); do
              case "$hint" in *"$fl"*) ;; *) echo "MISSING HINT FLAG $s $fl"; bad=1 ;; esac
            done
          done
          [ -z "$bad" ] || exit 1

      - name: Pair M — skill description ↔ command-stub argument-hint
        run: |
          bad=
          for d in claude/skills/ft-*/SKILL.md; do
            s=$(basename "$(dirname "$d")"); c="claude/commands/$s.md"
            [ -f "$c" ] || { echo "MISSING STUB  $s"; bad=1; continue; }
            df=" $(grep -m1 '^description:' "$d" | sed -E 's/"[^"]*"//g' \
                   | grep -oE '\-\-[a-z][a-z-]+' | sort -u | tr '\n' ' ')"
            for fl in $(grep -m1 '^argument-hint:' "$c" | grep -oE '\-\-[a-z][a-z-]+' | sort -u); do
              case "$fl" in --low|--med|--fut|--high) continue ;; esac
              case "$df" in *" $fl "*) ;; *) echo "UNDOCUMENTED FLAG $s $fl"; bad=1 ;; esac
            done
          done
          [ -z "$bad" ] || exit 1

      - name: Pair N — "[unattended]" candidacy mirrors ↔ SPEC/unattended-candidacy.md
        run: |
          bad=
          for f in $(grep -rl 'SPEC/unattended-candidacy\.md' claude/skills --include='*.md' | grep -v '^claude/skills/ft-release/'); do
            grep -q 'unattended-candidates:' "$f" || { echo "NO CANDIDATES LITERAL  $f"; bad=1; }
            labels=$(grep -oE 'mirror of `SPEC/unattended-candidacy\.md` §"[^"]+"' "$f")
            [ -n "$labels" ] || { echo "NO LABELED MIRROR  $f"; bad=1; }
            while IFS= read -r sec; do
              [ -n "$sec" ] || continue
              grep -qF -- "## $sec" SPEC/unattended-candidacy.md || { echo "STALE LABEL  $f — $sec is not a heading"; bad=1; }
            done < <(printf '%s\n' "$labels" | sed -E 's/.*§"([^"]+)"$/\1/' | sort -u)
          done
          [ -z "$bad" ] || exit 1

      - name: Pair O — filing runners ↔ SPEC §"Filing commits"
        run: |
          bad=
          for f in $(grep -rl 'auto-commit = ' claude/skills --include='*.md' | grep -v '^claude/skills/ft-release/'); do
            grep -e 'git diff --cached' "$f" | grep -qv -e '--quiet' || { echo "NO POST-STAGE DIFF  $f"; bad=1; }
            cites=$(grep -oE 'SPEC/[A-Za-z0-9_.-]+\.md[`)]? §"Filing commits"' "$f" | sed -E 's/[`)]? §.*//' | sort -u)
            [ -n "$cites" ] || { echo "NO RESOLVING CITATION  $f"; bad=1; }
            for src in $cites; do
              grep -q '^## Filing commits' "$src" 2>/dev/null || { echo "STALE CITATION  $f — $src has no Filing commits heading"; bad=1; }
            done
          done
          [ -z "$bad" ] || exit 1

      - name: Pair P — archived-tasknote integrity (docs/CONVENTIONS.md §"Archived-tasknote integrity floor")
        run: |
          bad=
          floor=2026-09-20
          for f in .flowtron/tasknote/archive/*/*.md; do
            d=$(grep -m1 -oE '^\*\*Archived:\*\* +[0-9]{4}-[0-9]{2}-[0-9]{2}' "$f" | sed -E 's/.* //' || true)
            [ -n "$d" ] || continue
            [[ "$d" < "$floor" ]] && continue
            grep -q '^status: completed$' "$f" || { echo "STATUS NOT COMPLETED  $f"; bad=1; }
            bare=$(awk '/^## ✅ Acceptance/{a=1;next} a&&/^## /{a=0} a' "$f" | grep -E '^ *- \[ \]' | grep -viE 'N/A|not[ -]met' || true)
            [ -z "$bare" ] || { printf '%s\n' "$bare" | sed "s|^|UNANNOTATED BOX  $f  |"; bad=1; }
          done
          [ -z "$bad" ] || exit 1
